<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 
    Favicon Purwakarta Health (Versi Ringkas untuk Tab Pelayar & Ikon Aplikasi)
    Menggunakan warna kecunan (gradient) premium dan bentuk yang dioptimumkan untuk resolusi kecil.
  -->
  <defs>
    <!-- Gradien Warna Premium untuk Perisai -->
    <linearGradient id="favShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a4dec6" />
      <stop offset="100%" stop-color="#408c74" />
    </linearGradient>
    
    <!-- Gradien Warna untuk Palang Medis -->
    <linearGradient id="favCrossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ebd9b" />
      <stop offset="100%" stop-color="#195947" />
    </linearGradient>
    
    <!-- Gradien Warna untuk Garis Denyutan Jantung & Jalur Melingkar -->
    <linearGradient id="favSwooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#184e40" />
      <stop offset="100%" stop-color="#54c1a1" />
    </linearGradient>

    <!-- Gradien Warna untuk Klinik/Rumah -->
    <linearGradient id="favHouseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#195544" />
      <stop offset="100%" stop-color="#0f3329" />
    </linearGradient>
  </defs>

  <!-- Latar Belakang Lut Sinar (Transparent Background) -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Kumpulan Elemen Logo Diperbesar dan Ditengah (Centered and Scaled for 512x512 Viewport) -->
  <g transform="translate(6, 15) scale(1.95)">
    <!-- 1. Perisai Pelindung Luar (Outer Shield Boundary) -->
    <path d="M 125,15 
             C 150,8 190,0 220,5 
             C 230,6 235,12 235,22 
             C 235,75 225,125 210,160 
             C 190,200 150,225 125,235 
             C 100,225 60,200 40,160 
             C 25,125 15,75 15,22 
             C 15,12 20,6 30,5 
             C 60,0 100,8 125,15 Z" 
          fill="none" 
          stroke="url(#favShieldGrad)" 
          stroke-width="15" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- 2. Palang Medis (Medical Cross) -->
    <path d="M 65,45 
             C 65,41 69,37 73,37 
             H 87 
             C 91,37 95,41 95,45 
             V 78 
             H 128 
             C 132,78 136,82 136,86 
             V 100 
             C 136,104 132,108 128,108 
             H 95 
             V 141 
             C 95,145 91,149 87,149 
             H 73 
             C 69,149 65,145 65,141 
             V 108 
             H 32 
             C 28,108 24,104 24,100 
             V 86 
             C 24,82 28,78 32,78 
             H 65 
             Z" 
          fill="url(#favCrossGrad)" />

    <!-- 3. Rumah Klinik (Clinic/House Icon) -->
    <!-- Struktur Rumah -->
    <path d="M 130,128 L 165,103 L 200,128 L 193,128 V 165 H 137 V 128 Z" fill="url(#favHouseGrad)" />
    <!-- Palang Kecil di Bumbung -->
    <path d="M 163,112 H 167 V 122 H 163 Z" fill="#54c1a1" />
    <path d="M 160,115 H 170 V 119 H 160 Z" fill="#54c1a1" />
    <!-- Pintu Rumah -->
    <path d="M 159,148 H 171 V 165 H 159 Z" fill="#ffffff" />

    <!-- 4. Garis Denyutan Jantung (EKG / Pulse Line) -->
    <path d="M 140,122 
             L 160,105 
             L 167,88 
             L 173,125 
             L 181,55 
             L 189,138 
             L 196,78 
             L 202,95 
             L 230,95" 
          fill="none" 
          stroke="url(#favSwooshGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 5. Jalur Melingkar Dinamik (Swoosh wrapping the shield) -->
    <path d="M -10,130 
             C -10,175 40,225 125,245 
             C 210,225 260,175 260,130 
             C 260,118 250,115 245,125 
             C 235,145 195,218 125,228 
             C 55,218 15,145 5,125 
             C 0,115 -10,118 -10,130 Z" 
          fill="url(#favSwooshGrad)" />

    <!-- Hiasan Daun / Titik Bawah Perisai (Bottom Shield Accent) -->
    <path d="M 110,230 C 125,225 125,250 140,230 C 130,252 120,252 110,230 Z" fill="url(#favSwooshGrad)" />
  </g>
</svg>